name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Create .env.test
        run: |
          cat > .env.test << 'EOF'
          ENVIRONMENT=testing
          DATABASE_URL=sqlite+aiosqlite:///:memory:
          REDIS_URL=
          JWT_SECRET=test-secret-key-do-not-use-in-prod-32chars
          JWT_BIND_IP=false
          JWT_MAX_SESSIONS=100
          KEY_ENCRYPTION_SECRET=test-enc-key-32bytesxxxxxx12345
          PROXY_WORKERS=1
          PROXY_DOCS_ENABLED=false
          LDAP_ENABLED=false
          PROXY_TLS_ENABLED=false
          LOG_FORMAT=text
          LOG_REQUEST_BODY=false
          BACKUP_ENABLED=false
          PASSWORD_MIN_LENGTH=8
          REQUIRE_REQUEST_SIGNING=false
          CACHE_ENABLED=false
          QUEUE_TIMEOUT_SECONDS=5
          EOF

      - name: Run tests
        env:
          ENVIRONMENT: testing
        run: |
          python -m pytest tests/ -v --tb=short --cov=. --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pip-audit

      - name: pip-audit
        run: pip-audit -r requirements.txt || true

      - name: Secret scan
        run: |
          if grep -rE 'sk-ant-|sk-[a-zA-Z0-9]{48}|AKIA[0-9A-Z]{16}' --include='*.py' --include='*.json' --include='*.yml' .; then
            echo "WARN: Possible secrets found"
            exit 1
          fi
          echo "No secrets found"
